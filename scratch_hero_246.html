<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>samayam ethrayai</title>
  <meta name="description" content="What time is it? An authentic Kerala quartz wall clock and physical TV remote with world flag buttons, inspired by TinkerHub.">

  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <!-- Minimalist Top Bar -->
  <header class="top-nav" id="topNav">
    <div class="nav-inner">
      <a href="#" class="brand-logo" id="brandLogo">
        <span class="logo-text">samayam.</span>
        <span class="logo-malayalam">സമയം</span>
      </a>

      <div class="nav-right">
        <div class="live-pill" id="livePill">
          <span class="pulse-dot"></span>
          <span id="navLiveTime">--:--:--</span>
        </div>

        <button class="icon-toggle-btn" id="soundToggleBtn" type="button" aria-label="Toggle Sound" title="Toggle Sound">
          <span id="soundIcon">🔊</span>
        </button>
      </div>
    </div>
  </header>

  <!-- UNIFIED SCROLL STORY TRACK: Text -> Clock -> Remote -->
  <div class="scroll-story-track" id="scrollStoryTrack">
    <div class="sticky-story-viewport" id="stickyViewport">
      
      <!-- STAGE 1: "samayam ethrayai" Text Layer -->
      <div class="hero-text-container" id="heroTextContainer">
        <div class="hero-kicker">KERALA · WORLD TIME</div>
        <h1 class="hero-heading" id="heroHeading">
          <span class="word-samayam">samayam</span>
          <span class="word-ethrayai">ethrayai</span>
        </h1>
        <div class="hero-malayalam-subtitle" id="heroMalayalam">സമയം എത്രയായി?</div>
        
        <button class="scroll-cta" id="scrollCta" type="button">
          <span>scroll down</span>
          <svg class="scroll-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <polyline points="19 12 12 19 5 12"></polyline>
          </svg>
        </button>
      </div>

      <!-- STAGE 2: Big Authentic Wall Clock Layer -->
      <div class="clock-overlay-layer" id="clockOverlayLayer">
        <div class="authentic-wall-clock" id="wallClockEl" role="img" aria-label="Authentic Kerala Quartz Wall Clock">
          <div class="clock-frame">
            <div class="clock-dial">
              <div class="dial-header">
                <span class="brand-name">SAMAYAM</span>
                <span class="brand-quartz">QUARTZ</span>
                <span class="brand-origin">KERALA</span>
              </div>

              <div class="clock-numerals">
                <span class="num n-12">12</span>
                <span class="num n-1">1</span>
                <span class="num n-2">2</span>
                <span class="num n-3">3</span>
                <span class="num n-4">4</span>
                <span class="num n-5">5</span>
                <span class="num n-6">6</span>
                <span class="num n-7">7</span>
                <span class="num n-8">8</span>
                <span class="num n-9">9</span>
                <span class="num n-10">10</span>
                <span class="num n-11">11</span>
              </div>

              <div class="dial-ticks" id="clockTicksContainer"></div>

              <div class="hands-center">
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minHand"></div>
                <div class="hand second-hand" id="secHand">
                  <div class="second-tail"></div>
                  <div class="second-rod"></div>
                </div>
                <div class="center-cap"></div>
              </div>
            </div>
          </div>
          <div class="clock-shadow"></div>
        </div>
      </div>

      <!-- STAGE 3: Big Authentic Physical TV Remote Layer (Only It) -->
      <div class="remote-overlay-layer" id="remoteOverlayLayer">
        <div class="physical-remote" id="physicalRemote" role="region" aria-label="Physical TV Remote Control">
          
          <!-- IR Top Diode & Emitter -->
          <div class="remote-head">
            <div class="ir-emitter-housing">
              <div class="ir-led" id="remoteIrLed" title="Infrared LED Transmitter"></div>
            </div>
          </div>

          <!-- Top Controls: Power, Voice Access, Mute -->
          <div class="remote-top-controls">
            <button class="rubber-btn power-btn" id="remotePowerBtn" type="button" title="Power" aria-label="Power">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
              </svg>
            </button>

            <!-- Central Big Voice Access Button -->
            <button class="rubber-btn voice-btn" id="remoteVoiceBtn" type="button" title="Voice Access" aria-label="Voice Access">
              <svg class="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
              <span class="voice-btn-label">VOICE</span>
            </button>

            <button class="rubber-btn mute-btn" id="remoteMuteBtn" type="button" title="Mute / Sound Toggle" aria-label="Mute">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>
          </div>

          <!-- Integrated Remote OLED Channel Display -->
          <div class="remote-oled-display" id="remoteOledDisplay">
            <span class="oled-ch" id="oledChannel">CH 01</span>
            <span class="oled-country" id="oledCountry">INDIA</span>
            <span class="oled-time" id="oledTime">06:30 PM</span>
          </div>

          <!-- Directional Navigation Cluster -->
          <div class="dpad-cluster">
            <button class="dpad-btn dpad-up" id="dpadUp" type="button" title="Previous Country" aria-label="Up">▲</button>
            <div class="dpad-middle-row">
              <button class="dpad-btn dpad-left" id="dpadLeft" type="button" title="Previous" aria-label="Left">◀</button>
              <button class="dpad-btn dpad-ok" id="dpadOk" type="button" title="Speak Time" aria-label="OK">OK</button>
              <button class="dpad-btn dpad-right" id="dpadRight" type="button" title="Next" aria-label="Right">▶</button>
            </div>
            <button class="dpad-btn dpad-down" id="dpadDown" type="button" title="Next Country" aria-label="Down">▼</button>
          </div>

          <!-- Quick Channel Bar (Vol / Ch) -->
          <div class="remote-rockers">
            <div class="rocker-pair">
              <span class="rocker-label">CH -</span>
              <button class="rubber-mini-btn" id="prevChBtn" type="button" aria-label="Previous Channel">‹</button>
            </div>
            <div class="rocker-pair">
              <button class="rubber-mini-btn home-btn" id="homeBtn" type="button" title="Home (Kerala / India)" aria-label="Home">🏠</button>
            </div>
            <div class="rocker-pair">
              <button class="rubber-mini-btn next-ch" id="nextChBtn" type="button" aria-label="Next Channel">›</button>
              <span class="rocker-label">CH +</span>
            </div>
          </div>

          <!-- Tactile Flags Grid -->
          <div class="remote-flag-grid" id="flagButtonsGrid" role="group" aria-label="Country Flag Channels">
            <!-- Filled dynamically with authentic flag buttons -->
          </div>

          <!-- Remote Base Brand Stamp -->
          <div class="remote-bottom-brand">
            <span class="brand-stamp">TINKER · SAMAYAM</span>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Clean Footer with User Credit -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="credit-text">
        Made by <a href="https://github.com/Lunarmist-byte" target="_blank" rel="noopener noreferrer">Lunarmist-byte</a>
        · <a href="https://www.linkedin.com/in/amal-s-kumar-ba69a1290/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        · <a href="https://github.com/Lunarmist-byte" target="_blank" rel="noopener noreferrer">GitHub</a>
      </p>
    </div>
  </footer>

  <script src="script.js?v=7"></script>
</body>
</html>
